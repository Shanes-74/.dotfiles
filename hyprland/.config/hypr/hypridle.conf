general {
    ignore_dbus_inhibit = false
}

# 💡 1 min → reduzir brilho em 99%
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 1%
    on-resume = brightnessctl -r
}

# 🔒 10 min → lock
listener {
    timeout = 600
    on-timeout = pkill hyprsunset || hyprlock
}

# 🌑 20 min → tela off
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
}

# 😴 30 min → suspender
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && systemctl suspend
}
